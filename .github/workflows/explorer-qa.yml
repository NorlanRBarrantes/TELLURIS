name: TELLURIS explorer static QA and deployment bundle

on:
  push:
    paths:
      - "website/public/**"
      - "website/tests/**"
      - "scripts/deploy-bana-static.sh"
      - ".github/workflows/explorer-qa.yml"
  pull_request:
    paths:
      - "website/public/**"
      - "website/tests/**"
      - "scripts/deploy-bana-static.sh"
      - ".github/workflows/explorer-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-mvp:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate server deploy script (syntax and no-write comparison)
        run: |
          bash -n scripts/deploy-bana-static.sh
          TARGET=$(mktemp -d)
          TELLURIS_REPO="$PWD" TELLURIS_ROOT="$TARGET" bash scripts/deploy-bana-static.sh --check
      - name: Syntax-check browser source
        run: |
          node --check website/public/assets/science.js
          node --check website/public/assets/explorer.js
          node --check website/public/assets/globe.js
          node --check website/public/assets/globe-layers.js
          node --check website/public/assets/matrix-core.js
          node --check website/public/assets/observatory.js
          node --check website/public/assets/decision-core.js
          node --check website/public/assets/evidence.js
          node --check website/public/assets/catalog.js
          node --check website/public/assets/inference.js
          node --check website/public/assets/report.js
          node --check website/public/assets/gpm.js
          node --check website/public/assets/seasonality.js
          node --check website/public/assets/scientific-print.js
      - name: Run science and archived NASA parity tests
        run: node --test website/tests/*.test.js
      - name: Run local HTTP smoke test
        run: |
          cd website/public
          python3 -m http.server 8765 --bind 127.0.0.1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8765/ | grep -q 'lang="es"'
          curl --fail --silent --show-error http://127.0.0.1:8765/en/ | grep -q 'lang="en"'
          curl --fail --silent --show-error http://127.0.0.1:8765/ | grep -q 'TELLURIS'
          curl --fail --silent --show-error http://127.0.0.1:8765/about/ | grep -q 'PROJECT URIEL'
          curl --fail --silent --show-error http://127.0.0.1:8765/en/about/ | grep -q 'PROJECT URIEL'
          curl --fail --silent --show-error http://127.0.0.1:8765/assets/journey.css | grep -q 'jg-hero'
          curl --fail --silent --show-error http://127.0.0.1:8765/telluris/ | grep -q 'lang="es"'
          curl --fail --silent --show-error http://127.0.0.1:8765/en/telluris/ | grep -q 'lang="en"'
          curl --fail --silent --show-error http://127.0.0.1:8765/telluris/explore/ | grep -q 'lang="es"'
          curl --fail --silent --show-error http://127.0.0.1:8765/en/telluris/explore/ | grep -q 'lang="en"'
          curl --fail --silent --show-error http://127.0.0.1:8765/telluris/explore/data/exp001-annual.json | grep -q "MERRA2"
          curl --fail --silent --show-error http://127.0.0.1:8765/assets/explorer.js | grep -q "fromSnapshot"
          curl --fail --silent --show-error http://127.0.0.1:8765/assets/inference.js | grep -q "blockOrderPermutation"
          curl --fail --silent --show-error http://127.0.0.1:8765/assets/report.js | grep -q "buildScientificReport"
          curl --fail --silent --show-error http://127.0.0.1:8765/assets/gpm.js | grep -q "comparePrecipitation"
          curl --fail --silent --show-error http://127.0.0.1:8765/assets/seasonality.js | grep -q "summarizeMonthly"
          curl --fail --silent --show-error http://127.0.0.1:8765/assets/scientific-print.js | grep -q "printableScientificReport"
          curl --fail --silent --show-error http://127.0.0.1:8765/telluris/explore/ | grep -q 'id="monthly-panel"'
          curl --fail --silent --show-error http://127.0.0.1:8765/en/telluris/explore/ | grep -q 'id="print-report"'
          curl --fail --silent --show-error http://127.0.0.1:8765/telluris/explore/ | grep -q 'id="gpm-comparison"'
          curl --fail --silent --show-error http://127.0.0.1:8765/en/telluris/explore/ | grep -q 'id="gpm-file"'
          curl --fail --silent --show-error http://127.0.0.1:8765/telluris/explore/ | grep -q 'id="inference-panel"'
          curl --fail --silent --show-error http://127.0.0.1:8765/en/telluris/explore/ | grep -q 'id="download-report"'
          curl --fail --silent --show-error http://127.0.0.1:8765/assets/ne_110m_land.geojson | grep -q 'FeatureCollection'
          curl --fail --silent --show-error http://127.0.0.1:8765/assets/globe-layers.js | grep -q 'GIBS_WMS'
          curl --fail --silent --show-error http://127.0.0.1:8765/assets/globe.css | grep -q 'globe-card-v2'
          curl --fail --silent --show-error http://127.0.0.1:8765/assets/observatory.js | grep -q 'planBatches'
          curl --fail --silent --show-error http://127.0.0.1:8765/assets/observatory.css | grep -q 'obs-modes'
          curl --fail --silent --show-error http://127.0.0.1:8765/telluris/explore/ | grep -q 'id="observatory"'
          curl --fail --silent --show-error http://127.0.0.1:8765/en/telluris/explore/ | grep -q 'id="obs-question-form"'
          curl --fail --silent --show-error http://127.0.0.1:8765/telluris/explore/ | grep -q 'id="globe-layer"'
          curl --fail --silent --show-error http://127.0.0.1:8765/en/telluris/explore/ | grep -q 'id="globe-nasa-legend"'
          curl --fail --silent --show-error http://127.0.0.1:8765/telluris/explore/ | grep -q 'globe-stage'
          curl --fail --silent --show-error http://127.0.0.1:8765/telluris/ | grep -q "TELLURIS"
          curl --fail --silent --show-error http://127.0.0.1:8765/telluris/catalog/ | grep -q 'lang="es"'
          curl --fail --silent --show-error http://127.0.0.1:8765/en/telluris/catalog/ | grep -q 'lang="en"'
          curl --fail --silent --show-error http://127.0.0.1:8765/telluris/catalog/data/catalog.json | grep -q 'telluris.catalog.2026-11-15.v2'
      - name: Package complete static site for BanaHosting
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: projecturiel-static-site-with-telluris-explorer
          path: website/public/
          if-no-files-found: error
          retention-days: 30

  deploy-bana:
    name: Deploy tested static website to BanaHosting (opt-in)
    needs: static-mvp
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      (vars.BANAHOSTING_AUTO_DEPLOY == 'true' ||
       (github.event_name == 'push' &&
        (contains(toJSON(github.event.commits), 'website/public/assets/telluris-evidence-film-115x.mp4') ||
         contains(github.event.head_commit.message, '[deploy-film]'))))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Configure pinned SSH credentials
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.BANAHOSTING_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.BANAHOSTING_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY" || { echo "SSH private key not configured"; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "Pinned known_hosts not configured"; exit 1; }
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Back up current BanaHosting document root
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.BANAHOSTING_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.BANAHOSTING_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.BANAHOSTING_SSH_USER }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_PORT"
          ssh -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            'ROOT="$HOME/projecturiel.earth"; test -d "$ROOT" && test -w "$ROOT" && mkdir -p "$HOME/TELLURIS_BACKUPS" && chmod 700 "$HOME/TELLURIS_BACKUPS" && tar --exclude="*.zip" --exclude="*.tar.gz" -czf "$HOME/TELLURIS_BACKUPS/pre-auto-deploy-$(date +%Y%m%d_%H%M%S).tar.gz" -C "$ROOT" .'
      - name: Synchronize tested site without deleting server-managed files
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.BANAHOSTING_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.BANAHOSTING_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.BANAHOSTING_SSH_USER }}
        run: |
          set -euo pipefail
          rsync -az --no-owner --no-group --chmod=D755,F644 \
            -e "ssh -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -i $HOME/.ssh/id_ed25519 -p $DEPLOY_PORT" \
            website/public/ "$DEPLOY_USER@$DEPLOY_HOST:/home/cvzvwazj/projecturiel.earth/"
          ssh -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            'chmod 755 "$HOME/projecturiel.earth"'
      - name: Public HTTPS smoke checks after publication
        shell: bash
        run: |
          set -euo pipefail
          for route in / /telluris/ /telluris/explore/ /telluris/catalog/ \
            /en/ /en/telluris/explore/ /en/telluris/catalog/ \
            /telluris/explore/data/exp001-annual.json \
            /telluris/catalog/data/catalog.json; do
            curl --fail --location --silent --show-error \
              --retry 2 --max-time 15 "https://projecturiel.earth$route" >/dev/null
            echo "HTTP OK: $route"
          done
          # Only when a real binary has been committed, verify the media and
          # bilingual entrypoint assets after deployment. A missing film must
          # never appear as a successfully published one.
          if [ -f website/public/assets/telluris-evidence-film-115x.mp4 ]; then
            curl --fail --head --location --silent --show-error --retry 2 --max-time 20 \
              https://projecturiel.earth/assets/telluris-evidence-film-115x.mp4 >/dev/null
            curl --fail --location --silent --show-error --retry 2 --max-time 30 \
              --range 0-1023 -o /dev/null \
              https://projecturiel.earth/assets/telluris-evidence-film-115x.mp4
            curl --fail --location --silent --show-error --max-time 15 \
              https://projecturiel.earth/assets/evidence-film.js >/dev/null
            curl --fail --location --silent --show-error --max-time 15 \
              https://projecturiel.earth/assets/evidence-film.css >/dev/null
            echo "EXP-017: public film and player assets pass HTTPS smoke tests"
          fi
