name: EXP-003C pre-register Caribbean MODIS land pixels

on:
  push:
    paths:
      - "analysis/exp003c_spatial_screen.py"
      - "tests/test_exp003c_spatial_screen.py"
      - ".github/workflows/exp003c-spatial-screen.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blind-modis-spatial-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test grid geometry and NASA bit masks without network
        run: python -m unittest discover -s tests -p "test_exp003c_spatial_screen.py" -v
      - name: Acquire one original MODIS composite for predeclared candidate sites
        run: python -u analysis/exp003c_spatial_screen.py
      - name: Preserve NASA source originals and full screening result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp003c-original-modis-spatial-pre-screen
          path: data/raw/exp003c/
          if-no-files-found: warn
          retention-days: 30
