name: EXP-004 verify NASA POWER variables on live endpoint

on:
  push:
    paths:
      - ".github/workflows/exp004-power-parameter-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify individual NASA POWER monthly parameter metadata at Liberia
        run: |
          python - <<'PY'
          import json,urllib.parse,urllib.request,time
          names=[
            ("T2M","RE"),("PRECTOTCORR","RE"),("RH2M","AG"),
            ("WS10M","RE"),("WD10M","RE"),("U10M","RE"),("V10M","RE"),
            ("ALLSKY_SFC_SW_DWN","RE"),("T2M_MAX","AG"),("T2M_MIN","AG"),
            ("PS","AG"),("CLOUD_AMT","AG"),("GWETROOT","HY"),
            ("GWETTOP","HY"),("EVPTRNS","HY"),("EVPTRNS","AG"),("EVPTRNS","RE"),("GWETROOT","AG"),("GWETROOT","RE"),("GWETTOP","AG"),("GWETTOP","RE"),("QV2M","AG"),
            ("ALLSKY_SFC_LW_DWN","RE"),("ALLSKY_SRF_ALB","RE")]
          results=[]
          for name,comm in names:
            query=urllib.parse.urlencode({"parameters":name,"community":comm,
             "latitude":10.63,"longitude":-85.44,"start":2023,"end":2023,"format":"JSON"})
            url="https://power.larc.nasa.gov/api/temporal/monthly/point?"+query
            try:
              request=urllib.request.Request(url,headers={"User-Agent":"ProjectUriel-TELLURIS-EXP004/1.0"})
              with urllib.request.urlopen(request,timeout=30) as r:
                status=r.status; payload=json.load(r)
              meta=payload.get("parameters",{}).get(name,{})
              series=payload.get("properties",{}).get("parameter",{}).get(name,{})
              valid=[k for k,v in series.items() if k!="202313" and isinstance(v,(int,float)) and v> -900]
              rec={"code":name,"community":comm,"http":status,"unit":meta.get("units"),
                   "longname":meta.get("longname"),"complete_months":len(valid),
                   "sample":series.get("202301")}
            except Exception as exc:
              rec={"code":name,"community":comm,"error":str(exc)[:230]}
            results.append(rec)
            print("POWER_PROBE",json.dumps(rec,ensure_ascii=False),flush=True)
            time.sleep(.2)
          with open("power_probe_results.json","w") as f:json.dump(results,f,indent=2)
          if not any(x.get("unit") for x in results):
            raise SystemExit("NASA POWER returned no source metadata for the entire probe.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp004-power-live-parameter-probe
          path: power_probe_results.json
          if-no-files-found: warn
          retention-days: 14
